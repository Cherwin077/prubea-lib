name: Build PHP 32-bit (armeabi-v7a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libtool bison re2c pkg-config wget unzip

      - name: Descargar Android NDK r27b Oficial
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip
          echo "NDK_PATH=$GITHUB_WORKSPACE/android-ndk-r27b" >> $GITHUB_ENV

      - name: Compilar Librerías C Necesarias (SQLite3 y Oniguruma para ARM32)
        run: |
          set -e -x
          export NDK=$NDK_PATH
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=armv7a-linux-androideabi
          export API=26
          
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export LD=$TOOLCHAIN/bin/ld.lld
          
          export PREFIX=$GITHUB_WORKSPACE/deps
          mkdir -p $PREFIX

          echo "--- Compilando SQLite3 ---"
          wget -q https://www.sqlite.org/2024/sqlite-autoconf-3450100.tar.gz
          tar -xf sqlite-autoconf-3450100.tar.gz
          cd sqlite-autoconf-3450100
          ./configure --host=armv7a-linux-androideabi --prefix=$PREFIX --disable-shared --enable-static CFLAGS="-O3 -fPIC"
          make -j$(nproc) && make install
          cd ..

          echo "--- Compilando Oniguruma ---"
          wget -q https://github.com/kkos/oniguruma/releases/download/v6.9.9/onig-6.9.9.tar.gz
          tar -xf onig-6.9.9.tar.gz
          cd onig-6.9.9
          ./configure --host=armv7a-linux-androideabi --prefix=$PREFIX --disable-shared --enable-static CFLAGS="-O3 -fPIC"
          make -j$(nproc) && make install
          cd ..

      - name: Descargar Código Fuente de PHP 8.4
        run: |
          wget -q https://www.php.net/distributions/php-8.4.0.tar.gz
          tar -xf php-8.4.0.tar.gz

      - name: Compilar libphp.so para 32 bits (armeabi-v7a)
        run: |
          set -e -x
          export NDK=$NDK_PATH
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=armv7a-linux-androideabi
          export API=26
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export AS=$CC
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export LD=$TOOLCHAIN/bin/ld.lld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          export PREFIX=$GITHUB_WORKSPACE/deps
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          
          cd php-8.4.0
          
          # Pasamos ac_cv_header_resolv_h=no directamente dentro de ./configure para forzar la desactivación de resolv.h
          ./configure \
            --build=x86_64-linux-gnu \
            --host=armv7a-linux-androideabi \
            --enable-embed=shared \
            --disable-cli \
            --disable-cgi \
            --disable-phpdbg \
            --without-pear \
            --disable-phar \
            --without-libxml \
            --disable-dom \
            --disable-simplexml \
            --disable-xml \
            --disable-xmlreader \
            --disable-xmlwriter \
            --without-iconv \
            --disable-mbregex \
            --enable-mbstring \
            --enable-bcmath \
            --with-sqlite3=$PREFIX \
            --with-pdo-sqlite=$PREFIX \
            --disable-opcache \
            CFLAGS="-O3 -fPIC -I$PREFIX/include" \
            LDFLAGS="-L$PREFIX/lib -latomic" \
            LIBS="-latomic" \
            php_cv_cc_rpath=no \
            ac_cv_func_memcmp_working=yes \
            ac_cv_header_resolv_h=no \
            ac_cv_func_res_ninit=no \
            ac_cv_func_res_nsearch=no \
            ac_cv_func_res_search=no \
            ac_cv_func_res_init=no \
            ac_cv_func___res_nsearch=no \
            ac_cv_func_dn_skipname=no \
            ac_cv_func___dn_skipname=no \
            ac_cv_func_dn_expand=no \
            ac_cv_func___dn_expand=no \
            ac_cv_func_res_ndestroy=no \
            ac_cv_func___res_ndestroy=no \
            ac_cv_func_dns_search=no \
            ac_cv_func___dns_search=no || { echo "=== DETALLE DEL ERROR DE CONFIGURACION ==="; tail -n 120 config.log; exit 1; }

          make -j$(nproc) || { echo "=== ERROR EN MAKE ==="; exit 1; }
          
          mkdir -p ../resultado
          cp libs/libphp.so ../resultado/libphp.so

      - name: Subir Binario Compilado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: libphp-32bit-armeabi-v7a
          path: resultado/libphp.so
