name: Build PHP 32-bit (armeabi-v7a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libtool bison re2c pkg-config wget unzip

      - name: Descargar Android NDK r27b Oficial
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip
          echo "NDK_PATH=$GITHUB_WORKSPACE/android-ndk-r27b" >> $GITHUB_ENV

      - name: Compilar Librerías C Necesarias (SQLite3 y Oniguruma para ARM32)
        run: |
          set -e -x
          export NDK=$NDK_PATH
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=armv7a-linux-androideabi
          export API=26
          
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export LD=$TOOLCHAIN/bin/ld.lld
          
          export PREFIX=$GITHUB_WORKSPACE/deps
          mkdir -p $PREFIX

          echo "--- Compilando SQLite3 ---"
          wget -q https://www.sqlite.org/2024/sqlite-autoconf-3450100.tar.gz
          tar -xf sqlite-autoconf-3450100.tar.gz
          cd sqlite-autoconf-3450100
          ./configure --host=armv7a-linux-androideabi --prefix=$PREFIX --disable-shared --enable-static CFLAGS="-O3 -fPIC"
          make -j$(nproc) && make install
          cd ..

          echo "--- Compilando Oniguruma ---"
          wget -q https://github.com/kkos/oniguruma/releases/download/v6.9.9/onig-6.9.9.tar.gz
          tar -xf onig-6.9.9.tar.gz
          cd onig-6.9.9
          ./configure --host=armv7a-linux-androideabi --prefix=$PREFIX --disable-shared --enable-static CFLAGS="-O3 -fPIC"
          make -j$(nproc) && make install
          cd ..

      - name: Descargar Código Fuente de PHP 8.4
        run: |
         wget -q https://www.php.net/distributions/php-8.4.0.tar.gz
         tar -xf php-8.4.0.tar.gz
         tar -czf php-source.tar.gz php-8.4.0

      - name: Compilar libphp.so para 32 bits (armeabi-v7a)
        run: |
          set -e -x
          export NDK=$NDK_PATH
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=armv7a-linux-androideabi
          export API=26
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export AS=$CC
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export LD=$TOOLCHAIN/bin/ld.lld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          export PREFIX=$GITHUB_WORKSPACE/deps
          export PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig
          
          cd php-8.4.0
          
          ./configure \
            --build=x86_64-linux-gnu \
            --host=armv7a-linux-androideabi \
            --enable-embed=shared \
            --disable-cli \
            --disable-cgi \
            --disable-phpdbg \
            --without-pear \
            --disable-phar \
            --without-libxml \
            --disable-dom \
            --disable-simplexml \
            --disable-xml \
            --disable-xmlreader \
            --disable-xmlwriter \
            --without-iconv \
            --disable-mbregex \
            --enable-mbstring \
            --enable-bcmath \
            --with-sqlite3=$PREFIX \
            --with-pdo-sqlite=$PREFIX \
            --disable-opcache \
            CFLAGS="-O3 -fPIC -I$PREFIX/include" \
            LDFLAGS="-L$PREFIX/lib -latomic" \
            LIBS="-latomic" || { echo "=== DETALLE DEL ERROR DE CONFIGURACION ==="; tail -n 120 config.log; exit 1; }

          # PARCHE DIRECTO: Modificar main/php_config.h para desactivar DNS de BIND en Android
          sed -i 's/#define HAVE_RES_SEARCH 1/\/\* #undef HAVE_RES_SEARCH \*\//g' main/php_config.h
          sed -i 's/#define HAVE_RES_NINIT 1/\/\* #undef HAVE_RES_NINIT \*\//g' main/php_config.h
          sed -i 's/#define HAVE_RES_NSEARCH 1/\/\* #undef HAVE_RES_NSEARCH \*\//g' main/php_config.h
          sed -i 's/#define HAVE_DNS_FUNCS 1/\/\* #undef HAVE_DNS_FUNCS \*\//g' main/php_config.h
          sed -i 's/#define HAVE_DN_SKIPNAME 1/\/\* #undef HAVE_DN_SKIPNAME \*\//g' main/php_config.h
          sed -i 's/#define HAVE_DN_EXPAND 1/\/\* #undef HAVE_DN_EXPAND \*\//g' main/php_config.h
          sed -i 's/#define HAVE___RES_NSEARCH 1/\/\* #undef HAVE___RES_NSEARCH \*\//g' main/php_config.h
          sed -i 's/#define HAVE___DN_SKIPNAME 1/\/\* #undef HAVE___DN_SKIPNAME \*\//g' main/php_config.h

          # ==========================================================
          # PARCHE ANDROID: getdtablesize() no existe en Bionic libc
          # ==========================================================
          echo "Aplicando parche Android para getdtablesize()..."

          grep -q '#include <unistd.h>' ext/standard/php_fopen_wrapper.c || \
          sed -i '/#include <fcntl.h>/a #include <unistd.h>' ext/standard/php_fopen_wrapper.c

          sed -i 's/getdtablesize()/sysconf(_SC_OPEN_MAX)/g' ext/standard/php_fopen_wrapper.c

          grep -n "sysconf(_SC_OPEN_MAX)" ext/standard/php_fopen_wrapper.c

          make -j$(nproc) || { echo "=== ERROR EN MAKE ==="; exit 1; }
          
          mkdir -p ../resultado
          cp libs/libphp.so ../resultado/libphp.so

      - name: Subir código fuente de PHP
        uses: actions/upload-artifact@v4
        with:
          name: php-source
          path: php-source.tar.gz
