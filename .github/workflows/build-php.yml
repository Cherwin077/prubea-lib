name: Build PHP 32-bit (armeabi-v7a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Instalar Dependencias del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libtool bison re2c pkg-config wget unzip

      - name: Descargar Android NDK r27b Oficial
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip -q android-ndk-r27b-linux.zip
          echo "NDK_PATH=$GITHUB_WORKSPACE/android-ndk-r27b" >> $GITHUB_ENV

      - name: Descargar Código Fuente de PHP 8.4
        run: |
          wget -q https://www.php.net/distributions/php-8.4.0.tar.gz
          tar -xf php-8.4.0.tar.gz

      - name: Compilar libphp.so para 32 bits (armeabi-v7a)
        run: |
          cd php-8.4.0
          
          # Variables de entorno para Android NDK r27
          export NDK=$NDK_PATH
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=armv7a-linux-androideabi
          export API=26
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export AS=$CC
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export LD=$TOOLCHAIN/bin/ld.lld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          # Configuración de PHP 8.4 para Android 32-bit
          ./configure \
            --build=x86_64-linux-gnu \
            --host=arm-linux-androideabi \
            --enable-embed=shared \
            --disable-cli \
            --disable-cgi \
            --disable-phpdbg \
            --without-pear \
            --disable-libxml \
            --disable-dom \
            --disable-simplexml \
            --disable-xml \
            --disable-xmlreader \
            --disable-xmlwriter \
            --without-iconv \
            --disable-mbregex \
            --enable-mbstring \
            --enable-bcmath \
            --with-pdo-sqlite \
            --with-sqlite3 \
            --disable-opcache \
            CFLAGS="-O3 -fPIC" || { echo "=== LOG DE ERROR DE CONFIGURACION ==="; cat config.log; exit 1; }

          make -j$(nproc) || { echo "=== ERROR EN MAKE ==="; exit 1; }
          
          # Guardar el binario generado
          mkdir -p ../resultado
          cp libs/libphp.so ../resultado/libphp.so

      - name: Subir Binario Compilado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: libphp-32bit-armeabi-v7a
          path: resultado/libphp.so
